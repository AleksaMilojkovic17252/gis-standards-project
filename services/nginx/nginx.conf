map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 200m;
    large_client_header_buffers 8 64k;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SensorThings (FROST)
    location /sta/mqtt {
        set $frost_ws frost:9876;
        proxy_pass http://$frost_ws/mqtt;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
    location /sta/ {
        set $frost frost:8080;
        rewrite ^/sta/(.*)$ /$1 break;
        proxy_pass http://$frost;
    }

    # pygeoapi
    location /ogc/ {
        set $pygeoapi pygeoapi:80;
        rewrite ^/ogc/(.*)$ /$1 break;
        proxy_pass http://$pygeoapi;
    }
    location = /ogc {
        return 301 /ogc/;
    }

    # Moving Features
    location /mf/ {
        set $mfapi mf-api:8000;
        rewrite ^/mf/(.*)$ /$1 break;
        proxy_pass http://$mfapi;
    }
    location = /mf {
        return 301 /mf/;
    }

    # web
    location / {
        set $web web:5173;
        proxy_pass http://$web;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
